name: CI/CD Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/oracle-feeder

jobs:
  # Job 1: Run tests, checks, and formatting
  test-and-lint:
    name: Test, Lint & Format
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Rust nightly
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        components: rustfmt, clippy
    
    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Auto-format code (if check fails)
      if: failure() && github.event_name == 'pull_request'
      run: |
        cargo fmt
        git diff --exit-code || (echo "Code was automatically formatted. Please commit the changes." && exit 1)
    
    - name: Run clippy
      run: cargo clippy -- -D warnings
    
    - name: Run unit tests
      run: cargo test --verbose --lib --bins
      env:
        RUST_BACKTRACE: 1
        CYBORG_TEST_KEY: "//Alice"
    
    - name: Run integration tests
      run: cargo test --test integration_tests --features integration -- --nocapture
      env:
        RUST_BACKTRACE: 1
        CYBORG_TEST_KEY: "//Alice"

  # Job 2: Build release binary
  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: test-and-lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Rust nightly
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
    
    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Build release binary
      run: cargo build --release --verbose
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: oracle-feeder-binary
        path: target/release/cyborg-oracle-feeder
        retention-days: 7

  # Job 3: Build and push Docker image (run on both PRs and pushes to dev)
  containerize:
    name: Build & Push Container
    runs-on: ubuntu-latest
    needs: build
    # Run on both PRs targeting dev and pushes to dev
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev')
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          # For PRs, use PR number and commit SHA
          type=ref,event=pr
          type=sha,prefix=pr-
          # For pushes to dev, use branch and staging tags
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=staging,enable=${{ github.event_name == 'push' }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job 4: Deploy to staging/testnet (run on both PRs and pushes to dev)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: containerize
    # Run on both PRs targeting dev and pushes to dev
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev')
    environment:
      name: staging
      url: http://staging.yourproject.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.STAGING_DEPLOY_KEY }}
    
    - name: Deploy to staging VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
          set -e
          
          echo "🚀 Starting deployment to staging..."
          
          # Navigate to deployment directory
          cd /home/cyborg/staging/cyborg-oracle-feeder || exit 1
          
          # Pull latest code
          echo "📥 Pulling latest code..."
          git fetch origin dev
          git reset --hard origin/dev
          
          # Stop existing service
          echo "⏸️  Stopping oracle-feeder service..."
          sudo systemctl stop oracle-feeder-staging.service || true
          
          # Build release
          echo "🔨 Building release..."
          cargo build --release
          
          # Run quick health check on binary
          echo "🏥 Running binary health check..."
          ./target/release/cyborg-oracle-feeder --version || exit 1
          
          # Start service
          echo "▶️  Starting oracle-feeder service..."
          sudo systemctl start oracle-feeder-staging.service
          
          # Wait for service to start
          sleep 5
          
          # Check service status
          echo "✅ Checking service status..."
          sudo systemctl is-active oracle-feeder-staging.service
          
          echo "✨ Deployment complete!"
        EOF
    
    - name: Verify deployment
      run: |
        echo "Waiting for service to be fully ready..."
        sleep 10
        
        # Check if service is responding (adjust endpoint as needed)
        curl -f http://${{ secrets.STAGING_HOST }}:8080/health || echo "Warning: Health check endpoint not available"

  # Job 5: Integration tests on staging (run on both PRs and pushes to dev)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    # Run on both PRs targeting dev and pushes to dev
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Rust nightly
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
    
    - name: Run integration tests against staging
      run: |
        echo "🧪 Running integration tests..."
        
        # Set staging environment
        export PARACHAIN_URL="${{ secrets.STAGING_PARACHAIN_URL }}"
        export STAGING_HOST="${{ secrets.STAGING_HOST }}"
        
        # Run integration tests
        cargo test --test integration_tests --features integration -- --nocapture
      env:
        RUST_BACKTRACE: 1
        CYBORG_TEST_KEY: "//Alice"
    
    - name: Test oracle feeder functionality
      run: |
        echo "🔍 Testing oracle feeder operations..."
        
        # Test 1: Check if service is running
        ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
          "sudo systemctl is-active oracle-feeder-staging.service"
        
        # Test 2: Check logs for errors
        ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
          "sudo journalctl -u oracle-feeder-staging.service -n 50 --no-pager | grep -i error && exit 1 || exit 0"
        
        # Test 3: Verify it's connecting to parachain
        ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
          "sudo journalctl -u oracle-feeder-staging.service -n 100 --no-pager | grep -i 'Starting the oracle feeder'"
        
        echo "✅ All functionality tests passed!"

  # Job 6: Post-deployment validation (run on both PRs and pushes to dev)
  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: integration-test
    # Run on both PRs targeting dev and pushes to dev
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev')
    
    steps:
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.STAGING_DEPLOY_KEY }}
    
    - name: Run deployment validation
      run: |
        echo "🔍 Validating deployment..."
        
        # Check service uptime
        ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
          echo "Service status:"
          sudo systemctl status oracle-feeder-staging.service --no-pager
          
          echo -e "\nRecent logs:"
          sudo journalctl -u oracle-feeder-staging.service -n 20 --no-pager
          
          echo -e "\nProcess info:"
          ps aux | grep cyborg-oracle-feeder | grep -v grep
        EOF
        
        echo "✅ Deployment validation complete!"
    
    - name: Notify deployment success
      if: success()
      run: |
        echo "🎉 Staging deployment successful and validated!"
        echo "All tests passed. Ready for production deployment."
    
    - name: Notify deployment failure
      if: failure()
      run: |
        echo "❌ Staging deployment failed validation!"
        echo "Please check the logs and fix issues before merging to production."
        exit 1

  # Job 7: Merge Approval Gate
  merge-approval:
    name: Merge Approval
    runs-on: ubuntu-latest
    needs: [test-and-lint, build, containerize, deploy-staging, integration-test, validate-deployment]
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    
    steps:
    - name: Check PR readiness
      run: |
        echo "## ✅ PR Ready for Merge" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### All CI checks passed:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Code formatting" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Clippy linting" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Unit tests" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Integration tests" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Build successful" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Container built and pushed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Staging deployment successful" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Integration tests passed on staging" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Deployment validation passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**This PR has been fully tested on staging and is ready for merge!**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
        echo "- Request reviews from maintainers" >> $GITHUB_STEP_SUMMARY
        echo "- Merge this PR to complete the deployment" >> $GITHUB_STEP_SUMMARY

  # Job 8: Production Ready (for push events only)
  production-ready:
    name: Ready for Production
    runs-on: ubuntu-latest
    needs: validate-deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    
    steps:
    - name: Summary
      run: |
        echo "## 🎉 Dev Branch Updated Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Integration tests passed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Deployment validated on staging" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Staging Environment:" >> $GITHUB_STEP_SUMMARY
        echo "- **URL**: http://staging.yourproject.com" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ✅ Running" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
        echo "- Monitor staging environment for any issues" >> $GITHUB_STEP_SUMMARY
        echo "- Create a release when ready for production" >> $GITHUB_STEP_SUMMARY